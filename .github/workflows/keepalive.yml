name: Keep-alive ping

# Backup for the external pinger: Render free instances sleep after ~15 min idle.
# Set the repository variable APP_URL (e.g. https://ask-olake.onrender.com).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    if: ${{ vars.APP_URL != '' }}
    steps:
      - run: curl -fsS --max-time 60 --retry 2 "${{ vars.APP_URL }}/healthz"
